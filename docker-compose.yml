services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - |
        try {
          rs.status().ok;
        } catch (e) {
          // Advertise "localhost:27017" (not the in-network "mongo:27017" hostname) so
          // clients connecting from the host machine can resolve the primary.
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
        }
